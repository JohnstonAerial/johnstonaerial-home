<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Johnston Aerial</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1d2552">
<meta name="apple-mobile-web-app-title" content="Johnston Aerial">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
  html,body{height:100%;margin:0;background:#1d2552;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  body{display:flex;align-items:center;justify-content:center;text-align:center}
  a{color:#f2c25a;font-size:1.1rem}
  img{width:96px;height:96px;border-radius:22px;margin-bottom:18px}
</style>
</head>
<body>
<main>
  <img src="icon-192.png" alt="">
  <p id="hint" hidden style="max-width:20rem;margin:0 auto 14px;color:#c9cfe8;line-height:1.4">Tap the Share button, then <b>Add to Home Screen</b>.</p>
  <p><a id="go" href="https://sites.google.com/view/johnstonaerialmedia/home">Open Johnston Aerial</a></p>
</main>
<script>
  var MAIN = 'https://www.johnstonaerial.com/';
  var FALLBACK = 'https://sites.google.com/view/johnstonaerialmedia/home';
  var link = document.getElementById('go');
  var done = false;
  function go(u) { if (!done) { done = true; location.replace(u); } }

  // Setup mode: open home.johnstonaerial.com/?add to stay on this page and add it to the Home Screen.
  if (/[?&]add\b/.test(location.search)) {
    history.replaceState(null, '', location.pathname);
    document.getElementById('hint').hidden = false;
  } else {
    // Prefer the main address; fall back to the Google Sites address if it can't be reached.
    var timer = setTimeout(function () { go(FALLBACK); }, 4000);
    fetch(MAIN, { mode: 'no-cors', cache: 'no-store' })
      .then(function () { clearTimeout(timer); link.href = MAIN; go(MAIN); })
      .catch(function () { clearTimeout(timer); go(FALLBACK); });
  }
</script>
</body>
</html>
